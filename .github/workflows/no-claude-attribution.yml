name: Block Claude attribution
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["**"]
permissions:
  contents: read
jobs:
  no-claude-attribution:
    name: no-claude-attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject Claude authors and trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess, sys
          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          rng = head if (not base or set(base) == {"0"}) else f"{base}..{head}"
          commits = subprocess.check_output(["git", "rev-list", rng], text=True).splitlines()
          failed = False
          for sha in commits:
              raw = subprocess.check_output(["git", "show", "-s", "--format=%an%n%ae%n%cn%n%ce%n%B", sha], text=True, errors="replace")
              parts = raw.split("\n", 4)
              if len(parts) < 5:
                  continue
              author, author_email, committer, committer_email, message = parts
              identity = " ".join([author, author_email, committer, committer_email])
              bad_identity = re.search(r"claude|anthropic|noreply@anthropic\.com", identity, re.I)
              bad_message = re.search(r"(?im)^\s*(?:co-authored-by:.*(?:claude|anthropic)|claude-session:.*|.*generated with.*claude code)", message)
              if bad_identity or bad_message:
                  print(f"FAIL: {sha} contains Claude/Anthropic identity or commit attribution.")
                  failed = True
          if failed:
              print("Remove the attribution and push corrected commits.")
              sys.exit(1)
          print("PASS: no Claude commit attribution found.")
          PY
